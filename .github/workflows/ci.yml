name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      # The published site is static; build tools never reach it. Fail on high advisories in
      # production dependencies and on critical advisories anywhere.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
