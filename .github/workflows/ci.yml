name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:static
      # The published site is static; build tools never reach it. Fail on high advisories in
      # production dependencies and on critical advisories anywhere.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
